<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LoWa Discover · New opportunity</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Familjen+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="engine.css">
<style>
h1{font-size:clamp(32px,8.5vw,48px);line-height:1.04;margin:6px 0 22px}
form{display:grid;gap:18px}
.loc{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.more{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;padding:0 18px;border-radius:16px;border:1.5px dashed var(--line);background:transparent;font:500 16px 'Familjen Grotesk',sans-serif;color:var(--ink);cursor:pointer}
.more svg{transition:transform .2s}
.more[aria-expanded="true"] svg{transform:rotate(45deg)}
.extra{display:none;gap:18px}
.extra.on{display:grid;animation:in .2s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.photo{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;min-height:72px}
.photo .ic{width:48px;height:48px;border-radius:12px;background:var(--cream);display:grid;place-items:center}
.photo span{font-size:13.5px;color:var(--muted);display:block}
.dup{border-radius:16px;padding:14px 16px;background:#FBEFD0;color:#6B4A00;font-size:14.5px}
.dup a{color:#6B4A00;font-weight:600}
.two{display:grid;gap:18px}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="proto-note">PROTOTYPE · capture screen · <a href="README.md">all screens</a></div>
<div class="app">
  <header class="top">
    <a class="back" href="Discover.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5 8 12l7 7"/></svg>Cancel</a>
    <span class="net"><i></i>Online</span>
  </header>

  <h1>New <em>opportunity</em></h1>

  <form id="f" novalidate>
    <div class="field">
      <label for="name">Business name <span class="req">required</span></label>
      <input class="input" id="name" name="name" autocomplete="off" autocapitalize="words" enterkeyhint="next" placeholder="e.g. the name on the sign" value="Juniper &amp; Clay">
    </div>

    <div class="field">
      <label for="city">City <span class="req">required</span></label>
      <input class="input" id="city" name="city" autocomplete="address-level2" enterkeyhint="done" value="Asheville, NC">
      <div class="loc">
        <button type="button" class="pill" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="11" r="3"/><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/></svg>Use my location</button>
        <button type="button" class="pill" aria-pressed="true">Asheville, NC</button>
        <button type="button" class="pill" aria-pressed="false">Charleston, SC</button>
      </div>
    </div>

    <div class="field">
      <span style="font-weight:500;font-size:15px">How did you find them?</span>
      <div class="pills" role="group" aria-label="How did you find them">
        <button type="button" class="pill" aria-pressed="true" data-g="how">Met in person</button>
        <button type="button" class="pill" aria-pressed="false" data-g="how">Found online</button>
      </div>
      <span class="hint">Used only to choose the right outreach message.</span>
    </div>

    <div class="dup" role="status">Similar name in Asheville: <a href="Oportunidade.html#review">Juniper Clay Studio</a> (captured Oct 3). Saving anyway is fine.</div>

    <button type="button" class="more" aria-expanded="false" aria-controls="extra">Add details <span class="mono" style="margin-left:auto;margin-right:12px">optional</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

    <div class="extra" id="extra">
      <label class="photo">
        <span class="ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
        <div><b style="font-weight:500">Photo of card, product or storefront</b><span>We read the name, website and handle from it.</span></div>
        <input type="file" accept="image/*" capture="environment" class="sr">
      </label>
      <div class="two">
        <div class="field"><label for="ig">Instagram</label><input class="input" id="ig" inputmode="url" autocapitalize="off" placeholder="@handle"></div>
        <div class="field"><label for="web">Website</label><input class="input" id="web" type="url" inputmode="url" autocapitalize="off" placeholder="example.com"></div>
      </div>
      <div class="field"><span style="font-weight:500;font-size:15px">Category</span>
        <div class="pills" role="group" aria-label="Category">
          <button type="button" class="pill" aria-pressed="true" data-g="cat">Handmade</button>
          <button type="button" class="pill" aria-pressed="false" data-g="cat">Food &amp; drink</button>
          <button type="button" class="pill" aria-pressed="false" data-g="cat">Boutique</button>
          <button type="button" class="pill" aria-pressed="false" data-g="cat">Services</button>
          <button type="button" class="pill" aria-pressed="false" data-g="cat">Agency</button>
          <button type="button" class="pill" aria-pressed="false" data-g="cat">Other</button>
        </div>
      </div>
      <div class="two">
        <div class="field"><label for="who">Contact person</label><input class="input" id="who" autocomplete="off" placeholder="First name is enough"></div>
        <div class="field"><label for="where">Where you found them</label><input class="input" id="where" placeholder="e.g. River Arts market"></div>
      </div>
      <div class="field"><label for="obs">Your observation</label><textarea id="obs" placeholder="What caught your eye? Voice dictation works here."></textarea></div>
    </div>
  </form>
</div>

<div class="bar">
  <div class="bar-in">
    <a class="btn block" href="Oportunidade.html#researching" id="go">Analyze <span aria-hidden="true">&rarr;</span></a>
  </div>
</div>
<div class="toast" id="t" role="status">Saved. Research started.</div>
<script>
const more=document.querySelector('.more'),ex=document.getElementById('extra');
more.addEventListener('click',()=>{const o=more.getAttribute('aria-expanded')!=='true';more.setAttribute('aria-expanded',o);ex.classList.toggle('on',o)});
document.querySelectorAll('.pill[data-g]').forEach(p=>p.addEventListener('click',()=>{document.querySelectorAll('.pill[data-g="'+p.dataset.g+'"]').forEach(x=>x.setAttribute('aria-pressed',x===p))}));
</script>
</body>
</html>
